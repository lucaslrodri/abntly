name: Release

# Pushing the tag `v<version>` (the version of typst.toml) runs the tests, publishes the package with gotpm to a fork
# of typst/packages (`gotpm publish`, which first runs the gate of typst.toml, `sh scripts/package.sh --check`, and then
# pushes the branch `<name>-<version>`) and creates the GitHub release. The pull request to Typst Universe is opened
# from the link in the job summary: its template is a checklist that the author has to confirm. Setup (fork, token)
# and local runs: see CONTRIBUTING.md.
on:
  push:
    tags: ["v*"]

env:
  # The repository that hosts Typst Universe.
  REGISTRY_REPO: typst/packages
  # Your fork of it; the secret REGISTRY_TOKEN must be able to push there. Override with the repository variable
  # REGISTRY_FORK when the fork is not called `<owner>/packages`.
  REGISTRY_FORK: ${{ vars.REGISTRY_FORK || format('{0}/packages', github.repository_owner) }}

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    name: Package, release, publish
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache fonts
        uses: actions/cache@v6
        with:
          path: fonts
          key: newcomputermodern-1

      # The template uses New Computer Modern, which Typst does not bundle (see tests.yml).
      - name: Download fonts
        run: sh scripts/fonts.sh --no-install

      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      # The files of the GitHub release (the gate of gotpm checks them again). The manuals are the committed PDFs:
      # the tests job has just checked that they match their sources.
      - name: Package
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          dir=$(sh scripts/package.sh dist)
          name=$(basename "$(dirname "$dir")")
          version=$(basename "$dir")
          (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/dist/$name-$version.zip" .)
          cp docs/manual-pt.pdf "dist/$name-$version-manual-pt.pdf"
          cp docs/manual-en.pdf "dist/$name-$version-manual-en.pdf"
          cp docs/example-pt.pdf "dist/$name-$version-example-pt.pdf"
          cp docs/example-en.pdf "dist/$name-$version-example-en.pdf"
          {
            echo "dir=$dir"
            echo "name=$name"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Install gotpm
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/npikall/gotpm/releases/download/v0.8.0/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # gotpm runs the gate of typst.toml (`sh scripts/package.sh --check`: the tag against the version, the imports and
      # the links, a work created from the published files and compiled, the version not yet on Typst Universe, the
      # checker of typst/packages), clones the fork, commits the package to `<name>-<version>` and pushes it. Its push
      # goes through git, with the token given by a credential helper; under act it stops before the push.
      - name: Publish to the fork of typst/packages (gotpm)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          # authored by whoever made the tagged commit
          git config --global user.name "$(git log -1 --pretty=format:%an)"
          git config --global user.email "$(git log -1 --pretty=format:%ae)"
          gotpm config set fork.url "https://github.com/$REGISTRY_FORK"
          if [ -n "${ACT:-}" ]; then
            gotpm publish --local -m "$NAME:$VERSION"
            exit 0
          fi
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "::error::the secret REGISTRY_TOKEN is not set (see CONTRIBUTING.md)"
            exit 1
          fi
          git config --global credential.https://github.com.helper \
            '!f() { echo username=x-access-token; echo "password=$REGISTRY_TOKEN"; }; f'
          gotpm publish -m "$NAME:$VERSION"

          url="https://github.com/$REGISTRY_REPO/compare/main...${REGISTRY_FORK%%/*}:${REGISTRY_FORK##*/}:$NAME-$VERSION?expand=1&title=$NAME:$VERSION"
          {
            echo "### $NAME:$VERSION is ready for Typst Universe"
            echo "Open the pull request and fill in its checklist: <$url>"
          } >> "$GITHUB_STEP_SUMMARY"

      # Not under act (see tests.yml); there, `sh scripts/package.sh` gives the same files in dist/.
      - name: Upload the package
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}
          path: |
            dist/*.zip
            dist/*.pdf
          retention-days: 5

      - name: Create the GitHub release
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.pdf --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
